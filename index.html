<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>NBA · Previous Game Day</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; }
    body { display: grid; place-items: center; color: #fff; overflow: hidden; }
    #widget { width: 100%; min-width: 0; display: grid; justify-items: center; gap: 9px; padding: 6px 0 7px; }
    #games {
      display: flex; align-items: stretch; gap: 7px;
      width: max-content; max-width: 100%;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; scrollbar-color: #ffffff55 transparent;
      padding: 2px 6px 4px;
      -webkit-overflow-scrolling: touch;
    }
    #games:empty { display: none; }
    a.game {
      position: relative; display: flex; flex: 0 0 82px;
      flex-direction: column; align-items: center; justify-content: center;
      min-height: 130px; padding: 7px 6px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      background: rgba(18, 22, 31, .66);
      box-shadow: 0 3px 14px rgba(0,0,0,.12);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: inherit; text-decoration: none;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    a.game:hover, a.game:focus-visible {
      background: rgba(36, 43, 57, .86);
      border-color: rgba(255, 255, 255, .52);
      transform: translateY(-2px);
      outline: none;
    }
    a.game:focus-visible { outline: 2px solid #a6d4ff; outline-offset: 2px; }
    .team { display: flex; flex-direction: column; align-items: center; gap: 0; width: 100%; }
    .team.home { flex-direction: column-reverse; }
    .logo { width: 31px; height: 31px; object-fit: contain; display: block; }
    .initials {
      width: 31px; height: 31px; display: grid; place-items: center;
      font-size: 10px; font-weight: 750; letter-spacing: -.04em;
      border-radius: 50%; background: #455169;
    }
    .score { font-size: 21px; font-weight: 540; line-height: 25px; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .score.loser { color: #b9c0ce; font-weight: 440; }
    .score.winner { color: #fff; font-weight: 760; }
    .score-separator { height: 1px; width: 28px; background: #ffffff22; margin: 2px 0; }
    #status {
      max-width: 96vw; text-align: center; font-size: 10px; font-weight: 650;
      line-height: 14px; letter-spacing: .15em; text-transform: uppercase;
      color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.7);
    }
    #status:empty { display: none; }
    #message {
      display: none; padding: 10px 14px; max-width: min(90vw, 500px);
      font-size: 13px; text-align: center;
      background: rgba(18, 22, 31, .75); border-radius: 12px;
    }
    #message a { color: #bde5ff; }
    @media (prefers-reduced-motion: reduce) { a.game { transition: none; } }
  </style>
</head>
<body>
  <main id="widget" aria-label="NBA results from the last completed game day">
    <div id="games" aria-live="polite"></div>
    <div id="status" role="status">Loading NBA scores…</div>
    <div id="message" role="alert"></div>
  </main>

  <script>
    "use strict";

    // You can safely change these values later if you want different behaviour.
    const DAYS_TO_CHECK = 14;
    const CACHE_MINUTES = 15;
    const ESPN_URL = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
    const gamesElement = document.getElementById("games");
    const statusElement = document.getElementById("status");
    const messageElement = document.getElementById("message");

    // NBA game days are grouped by US Eastern calendar date, not UK local date.
    function easternTodayUTC() {
      const dateParts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const part = (name) => Number(dateParts.find((p) => p.type === name).value);
      return new Date(Date.UTC(part("year"), part("month") - 1, part("day")));
    }

    function dateKey(date) {
      return date.toISOString().slice(0, 10).replace(/-/g, "");
    }

    function readableDate(date) {
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "UTC", weekday: "short", day: "numeric", month: "short"
      }).format(date);
    }

    function youtubeLink(away, home, date) {
      const longDate = new Intl.DateTimeFormat("en-US", {
        timeZone: "UTC", month: "long", day: "numeric", year: "numeric"
      }).format(date);
      const query = `NBA ${away.team.displayName} vs ${home.team.displayName} full game highlights ${longDate}`;
      return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
    }

    function completeGame(event) {
      return event?.status?.type?.completed === true ||
             event?.competitions?.[0]?.status?.type?.completed === true;
    }

    async function fetchOneDay(date) {
      const response = await fetch(`${ESPN_URL}?dates=${dateKey(date)}&limit=50`);
      if (!response.ok) throw new Error(`ESPN returned HTTP ${response.status}`);
      const result = await response.json();
      if (!Array.isArray(result.events)) throw new Error("Unexpected ESPN response");
      return result.events;
    }

    async function findLastFinishedDay() {
      const todayET = easternTodayUTC();
      const cacheKey = "nba-recap-v1";
      try {
        const stored = JSON.parse(localStorage.getItem(cacheKey));
        if (stored?.todayKey === dateKey(todayET) &&
            (Date.now() - stored.savedAt) < CACHE_MINUTES * 60000 &&
            Array.isArray(stored.games)) {
          return { date: stored.date ? new Date(stored.date + "T00:00:00Z") : null,
                   events: stored.games };
        }
      } catch (_) { /* Storage can be blocked in an extension iframe. That's fine. */ }

      for (let offset = 1; offset <= DAYS_TO_CHECK; offset++) {
        const date = new Date(todayET.getTime() - offset * 86400000);
        const events = await fetchOneDay(date);
        if (!events.length) continue;
        // Do not show partial slates, live games, or upcoming games.
        if (!events.every(completeGame)) continue;
        const value = { date, events };
        try {
          localStorage.setItem(cacheKey, JSON.stringify({
            todayKey: dateKey(todayET), savedAt: Date.now(),
            date: date.toISOString().slice(0, 10), games: events
          }));
        } catch (_) { /* Widget works without local storage. */ }
        return value;
      }
      try {
        localStorage.setItem(cacheKey, JSON.stringify({
          todayKey: dateKey(todayET), savedAt: Date.now(), date: null, games: []
        }));
      } catch (_) { /* Ignore storage errors. */ }
      return { date: null, events: [] };
    }

    function scoreText(value) {
      return String(typeof value === "object"
        ? (value?.displayValue ?? value?.value ?? "—")
        : (value ?? "—"));
    }

    function teamStack(competitor, order, won) {
      const element = document.createElement("div");
      element.className = "team " + order;

      const logoUrl = competitor.team?.logo || competitor.team?.logos?.[0]?.href || "";
      let logo;
      if (typeof logoUrl === "string" && logoUrl.startsWith("https://")) {
        logo = document.createElement("img");
        logo.className = "logo";
        logo.src = logoUrl;
        logo.alt = competitor.team?.displayName || "Team logo";
        logo.width = 31; logo.height = 31;
        logo.loading = "eager";
        logo.referrerPolicy = "no-referrer";
        logo.addEventListener("error", () => {
          const substitute = document.createElement("span");
          substitute.className = "initials";
          substitute.textContent = competitor.team?.abbreviation || "NBA";
          logo.replaceWith(substitute);
        }, { once: true });
      } else {
        logo = document.createElement("span");
        logo.className = "initials";
        logo.textContent = competitor.team?.abbreviation || "NBA";
      }
      const score = document.createElement("span");
      score.className = "score " + (won ? "winner" : "loser");
      score.textContent = scoreText(competitor.score);
      element.append(logo, score);
      return element;
    }

    function displayDay(result) {
      const { date, events } = result;
      gamesElement.replaceChildren();
      messageElement.style.display = "none";
      messageElement.textContent = "";

      if (!events.length || !date) {
        statusElement.textContent = "No finished NBA game days in the last 14 days";
        return;
      }

      let shown = 0;
      for (const event of events) {
        const competitors = event?.competitions?.[0]?.competitors || [];
        const away = competitors.find((c) => c.homeAway === "away");
        const home = competitors.find((c) => c.homeAway === "home");
        if (!away || !home) continue;

        const card = document.createElement("a");
        card.className = "game";
        card.href = youtubeLink(away, home, date);
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.title = `${away.team.displayName} ${scoreText(away.score)} – ${home.team.displayName} ${scoreText(home.score)}. Open YouTube highlights search.`;
        card.setAttribute("aria-label", card.title);

        const awayScore = Number(scoreText(away.score));
        const homeScore = Number(scoreText(home.score));
        const awayWon = awayScore > homeScore;
        const homeWon = homeScore > awayScore;
        const divider = document.createElement("div");
        divider.className = "score-separator";
        divider.setAttribute("aria-hidden", "true");
        card.append(teamStack(away, "away", awayWon), divider, teamStack(home, "home", homeWon));
        gamesElement.appendChild(card);
        shown++;
      }
      statusElement.textContent = shown
        ? `NBA · ${readableDate(date)} · Final · Click for highlights`
        : "No scores available for the selected NBA game day";
    }

    function showError(error) {
      gamesElement.replaceChildren();
      statusElement.textContent = "NBA · Scores unavailable";
      messageElement.textContent = "Could not load scores. ";
      const retry = document.createElement("a");
      retry.href = "#";
      retry.textContent = "Try again";
      retry.addEventListener("click", (event) => { event.preventDefault(); load(); });
      messageElement.append(retry);
      messageElement.style.display = "block";
      console.error("NBA recap error:", error);
    }

    async function load() {
      try { displayDay(await findLastFinishedDay()); }
      catch (error) { showError(error); }
    }

    load();
    // Also update tabs that are left open overnight.
    setInterval(load, 15 * 60 * 1000);
  </script>
</body>
</html>
