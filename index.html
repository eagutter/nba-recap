<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA · Last seven completed game days</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background: transparent !important;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      color: #fff; overflow: hidden;
    }
    #widget {
      width: 100%; max-width: 100%; min-width: 0;
      padding: 5px 7px; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 8px;
      background: transparent !important;
    }
    #games {
      --gap: 7px;
      --card-width: 76px;
      display: flex; flex-wrap: nowrap; align-items: center;
      justify-content: flex-start; gap: var(--gap);
      width: max-content; max-width: 100%; min-width: 0;
      margin-inline: auto; padding: 4px 2px 10px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.42) transparent;
      background: transparent !important;
    }
    #games::-webkit-scrollbar { height: 6px; }
    #games::-webkit-scrollbar-track { background: transparent; }
    #games::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.42);
      border-radius: 100px;
    }
    #games:empty { display: none; }
    .game {
      position: relative; display: flex; flex: 0 0 var(--card-width);
      width: var(--card-width); flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 128px; padding: 7px 4px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: rgba(18,22,31,.73);
      box-shadow: 0 4px 12px rgba(0,0,0,.16);
      -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
      color: #fff; text-decoration: none;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    a.game { cursor: pointer; }
    a.game:hover, a.game:focus-visible {
      background: rgba(40,47,63,.91);
      border-color: rgba(255,255,255,.62);
      transform: translateY(-2px); outline: none;
    }
    a.game:focus-visible { outline: 2px solid #bfe2ff; outline-offset: 2px; }
    .game.pending { cursor: default; }
    .game.pending:hover { border-color: rgba(255,255,255,.16); }
    .team {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 0; width: 100%;
    }
    .team.home { flex-direction: column-reverse; }
    .logo {
      display: block; width: min(31px, calc(var(--card-width) * .48));
      height: min(31px, calc(var(--card-width) * .48)); object-fit: contain;
    }
    .initials {
      width: min(31px, calc(var(--card-width) * .48));
      height: min(31px, calc(var(--card-width) * .48));
      display: grid; place-items: center; border-radius: 50%;
      background: #485266; font-size: 10px; font-weight: 750;
    }
    .score {
      font-size: clamp(15px, calc(var(--card-width) * .27), 21px);
      line-height: 25px; letter-spacing: -.045em;
      font-variant-numeric: tabular-nums; font-weight: 530;
    }
    .score.loser { color: #b7c0cf; font-weight: 440; }
    .score.winner { color: #fff; font-weight: 760; }
    .score-separator { height: 1px; width: min(28px, 70%); background: #ffffff2a; margin: 2px 0; }
    #status {
      max-width: 98%; min-height: 14px; text-align: center;
      font-size: 10px; font-weight: 650; line-height: 14px;
      letter-spacing: .13em; text-transform: uppercase;
      color: rgba(255,255,255,.90);
      text-shadow: 0 1px 7px rgba(0,0,0,.95);
    }
    #status:empty { display: none; }
    #navigation { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 20px; max-width: 100%; }
    #navigation[hidden] { display: none; }
    .day-arrow {
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 24px;
      width: 24px; height: 24px; padding: 0;
      color: rgba(255,255,255,.92);
      border: 0; border-radius: 6px; background: rgba(18,22,31,.40);
      cursor: pointer; transition: background .15s ease, opacity .15s ease;
      appearance: none; -webkit-appearance: none;
    }
    .day-arrow svg {
      display: block; width: 11px; height: 11px;
      stroke: currentColor; stroke-width: 2.4; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .day-arrow:hover:not(:disabled) { background: rgba(50,60,80,.85); }
    .day-arrow:focus-visible { outline: 2px solid #bfe2ff; outline-offset: 2px; }
    .day-arrow:disabled { opacity: .28; cursor: default; background: transparent; }
    #message {
      display: none; max-width: 90%; padding: 10px 14px;
      font-size: 13px; text-align: center;
      background: rgba(18,22,31,.72); border-radius: 12px;
    }
    #message a { color: #bde5ff; }
    @media (prefers-reduced-motion: reduce) { .game { transition: none; } }
  </style>
</head>
<body>
  <main id="widget" aria-label="NBA results from the last seven completed game days">
    <div id="games" aria-live="polite"></div>
    <div id="navigation">
      <button type="button" class="day-arrow" id="older" aria-label="Previous NBA game day" title="Previous NBA game day" disabled>
        <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M7.5 2.25L3.75 6l3.75 3.75"/></svg>
      </button>
      <div id="status" role="status">Loading NBA scores…</div>
      <button type="button" class="day-arrow" id="newer" aria-label="Next NBA game day" title="Next NBA game day" disabled>
        <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4.5 2.25L8.25 6 4.5 9.75"/></svg>
      </button>
    </div>
    <div id="message" role="alert"></div>
  </main>
  <script>
    "use strict";
    const GAME_DAYS_TO_SHOW = 7;
    const DAYS_TO_CHECK = 21; // Search far enough back to include weekends and occasional off days.
    const CACHE_MINUTES = 15;
    const SCORES_CACHE_KEY = "nba-recap-game-days-v1";
    const ESPN_URL = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
    const gamesElement = document.getElementById("games");
    const statusElement = document.getElementById("status");
    const messageElement = document.getElementById("message");
    const olderButton = document.getElementById("older");
    const newerButton = document.getElementById("newer");
    let recentDays = [];
    let recentVideos = [];
    let selectedDateKey = null;

    function easternTodayUTC() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const part = name => Number(parts.find(p => p.type === name).value);
      return new Date(Date.UTC(part("year"), part("month") - 1, part("day")));
    }
    const dateKey = date => date.toISOString().slice(0,10).replace(/-/g, "");
    function readableDate(date) {
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "UTC", weekday: "short", day: "numeric", month: "short"
      }).format(date);
    }
    const completeGame = event =>
      event?.status?.type?.completed === true ||
      event?.competitions?.[0]?.status?.type?.completed === true;

    async function fetchOneDay(date) {
      const response = await fetch(`${ESPN_URL}?dates=${dateKey(date)}&limit=50`);
      if (!response.ok) throw new Error(`ESPN returned HTTP ${response.status}`);
      const body = await response.json();
      if (!Array.isArray(body.events)) throw new Error("Unexpected ESPN data format");
      return body.events;
    }

    async function findRecentFinishedDays() {
      const todayET = easternTodayUTC();
      try {
        const cached = JSON.parse(localStorage.getItem(SCORES_CACHE_KEY));
        if (cached?.todayKey === dateKey(todayET) &&
            Date.now() - cached.savedAt < CACHE_MINUTES * 60000 &&
            Array.isArray(cached.days)) {
          return cached.days.map(day => ({
            date: new Date(day.date + "T00:00:00Z"), events: day.events
          })).filter(day => !Number.isNaN(day.date.getTime()) && Array.isArray(day.events));
        }
      } catch (_) { /* Optional cache, potentially blocked in an iframe. */ }

      const days = [];
      let errors = 0;
      // Request up to seven dates concurrently. Stop as soon as we have
      // seven fully finished game days; never include scheduled/live games.
      for (let start = 1; start <= DAYS_TO_CHECK && days.length < GAME_DAYS_TO_SHOW; start += 7) {
        const offsets = Array.from({ length: Math.min(7, DAYS_TO_CHECK - start + 1) }, (_, i) => start + i);
        const batch = await Promise.all(offsets.map(async offset => {
          const date = new Date(todayET.getTime() - offset * 86400000);
          try {
            return { date, events: await fetchOneDay(date) };
          } catch (error) {
            errors++;
            console.warn("Unable to read NBA scores for", dateKey(date), error);
            return null;
          }
        }));
        for (const day of batch) {
          if (day && day.events.length && day.events.every(completeGame)) days.push(day);
          if (days.length === GAME_DAYS_TO_SHOW) break;
        }
      }
      if (!days.length && errors) throw new Error("Could not retrieve completed NBA scores");
      // Keep historical scores for a short time; the highlight list is fetched separately.
      if (!errors) {
        try {
          localStorage.setItem(SCORES_CACHE_KEY, JSON.stringify({
            todayKey: dateKey(todayET), savedAt: Date.now(),
            days: days.map(d => ({ date: d.date.toISOString().slice(0, 10), events: d.events }))
          }));
        } catch (_) { /* Optional cache. */ }
      }
      return days;
    }
    async function fetchMotionStationVideos() {
      try {
        const cacheBuster = Math.floor(Date.now() / (15*60*1000));
        const response = await fetch(`./videos.json?v=${cacheBuster}`, { cache: "no-store" });
        if (!response.ok) return [];
        const data = await response.json();
        return Array.isArray(data.videos) ? data.videos.filter(v =>
          typeof v.title === "string" && /^[a-zA-Z0-9_-]{11}$/.test(v.id) &&
          typeof v.published === "string") : [];
      } catch (error) {
        console.warn("Motion Station feed not available yet:", error);
        return [];
      }
    }

    const normalize = text => String(text || "").toLowerCase()
      .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, " ").trim();
    const scoreText = value => String(typeof value === "object"
      ? (value?.displayValue ?? value?.value ?? "—") : (value ?? "—"));

    // Use the team nickname (e.g. "Celtics") so uploads with abbreviated
    // titles still match. Prefer exact scores, but accept one correct score
    // when the channel makes a typo (e.g. Raptors 135, Bulls 102 vs 135-92).
    function teamAliases(team) {
      const name = normalize(team?.displayName);
      const nickname = normalize(team?.name);
      const aliases = [name, nickname];
      if (name.endsWith("trail blazers")) aliases.push("blazers");
      if (name.endsWith("76ers")) aliases.push("sixers");
      if (name.endsWith("clippers")) aliases.push("la clippers");
      return [...new Set(aliases.filter(x => x.length >= 4))];
    }
    function mentionsTeam(title, team) {
      return teamAliases(team).some(name => (" " + title + " ").includes(" " + name + " "));
    }
    function findHighlight(away, home, gameDate, videos) {
      const dayStart = gameDate.getTime();
      const awayScore = Number(scoreText(away.score));
      const homeScore = Number(scoreText(home.score));
      const validScores = Number.isFinite(awayScore) && Number.isFinite(homeScore);
      let best = null;
      for (const video of videos) {
        const title = normalize(video.title);
        if (!mentionsTeam(title, away.team) || !mentionsTeam(title, home.team)) continue;
        const publishedAt = Date.parse(video.published);
        if (!Number.isFinite(publishedAt)) continue;
        const hoursAfterDayStart = (publishedAt - dayStart) / 3600000;
        if (hoursAfterDayStart < -12 || hoursAfterDayStart > 85) continue;
        const numbers = [...title.matchAll(/\b\d{2,3}\b/g)]
          .map(m => Number(m[0])).filter(n => n >= 65 && n <= 200);
        const scoresMatched = validScores
          ? Number(numbers.includes(awayScore)) + Number(numbers.includes(homeScore))
          : 0;
        // If a title specifies both scores, insist that at least one is right.
        // The two teams and upload date must also match (checked above).
        // This tolerates a typo in one score without trusting unrelated recaps.
        if (numbers.length >= 2 && scoresMatched === 0) continue;
        const likelyRecap = /\b(recap|highlight|highlights)\b/.test(title);
        // Prefer two correct scores over one, and scored titles over unscored ones.
        const scoreQuality = scoresMatched === 2 ? 100 : scoresMatched === 1 ? 60 : 0;
        const quality = scoreQuality + (likelyRecap ? 10 : 0) -
          Math.abs(hoursAfterDayStart - 31)/100;
        if (!best || quality > best.quality) best = { quality, id: video.id };
      }
      return best ? `https://www.youtube.com/watch?v=${best.id}` : null;
    }

    function teamStack(competitor, order, winner) {
      const element = document.createElement("div");
      element.className = "team " + order;
      const logoUrl = competitor.team?.logo || competitor.team?.logos?.[0]?.href || "";
      let logo;
      if (typeof logoUrl === "string" && logoUrl.startsWith("https://")) {
        logo = document.createElement("img");
        logo.className = "logo"; logo.src = logoUrl;
        logo.alt = competitor.team?.displayName || "NBA team";
        logo.loading = "eager"; logo.referrerPolicy = "no-referrer";
        logo.addEventListener("error", () => {
          const fallback = document.createElement("span");
          fallback.className = "initials";
          fallback.textContent = competitor.team?.abbreviation || "NBA";
          logo.replaceWith(fallback);
        }, { once: true });
      } else {
        logo = document.createElement("span");
        logo.className = "initials";
        logo.textContent = competitor.team?.abbreviation || "NBA";
      }
      const score = document.createElement("span");
      score.className = "score " + (winner ? "winner" : "loser");
      score.textContent = scoreText(competitor.score);
      element.append(logo, score);
      return element;
    }

    function fitCards() {
      const count = gamesElement.children.length;
      if (!count) return;
      const width = gamesElement.parentElement.clientWidth - 20;
      const gap = 7;
      // Use one row. Cards shrink down to 46px; after that the
      // games container scrolls horizontally instead of wrapping.
      const ideal = (width - (count-1)*gap - 4)/count;
      const cardWidth = Math.min(76, Math.max(46, ideal));
      gamesElement.style.setProperty("--card-width", cardWidth.toFixed(1) + "px");
    }

    function displayDay({ date, events }, videos) {
      gamesElement.replaceChildren();
      messageElement.style.display = "none";
      messageElement.textContent = "";
      if (!date || !events.length) {
        statusElement.textContent = `No completed NBA game day in the last ${DAYS_TO_CHECK} days`;
        return;
      }
      for (const event of events) {
        const competitors = event?.competitions?.[0]?.competitors || [];
        const away = competitors.find(c => c.homeAway === "away");
        const home = competitors.find(c => c.homeAway === "home");
        if (!away || !home) continue;
        const highlight = findHighlight(away, home, date, videos);
        const card = document.createElement(highlight ? "a" : "div");
        card.className = "game" + (highlight ? "" : " pending");
        const description = `${away.team.displayName} ${scoreText(away.score)} – ${home.team.displayName} ${scoreText(home.score)}`;
        if (highlight) {
          card.href = highlight;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.title = description + ". Watch Motion Station highlights on YouTube.";
        } else {
          card.title = description + ". Motion Station highlights not available yet.";
        }
        card.setAttribute("aria-label", card.title);
        const awayWon = Number(scoreText(away.score)) > Number(scoreText(home.score));
        const homeWon = Number(scoreText(home.score)) > Number(scoreText(away.score));
        const divider = document.createElement("div");
        divider.className = "score-separator";
        divider.setAttribute("aria-hidden", "true");
        card.append(teamStack(away, "away", awayWon), divider,
                    teamStack(home, "home", homeWon));
        gamesElement.appendChild(card);
      }
      fitCards();
      const n = gamesElement.children.length;
      statusElement.textContent = n
        ? `NBA · ${readableDate(date)}`
        : "No NBA scores found";
    }

    function displaySelectedDay() {
      const position = recentDays.findIndex(day => dateKey(day.date) === selectedDateKey);
      const index = position < 0 ? 0 : position;
      olderButton.disabled = !recentDays.length || index >= recentDays.length - 1;
      newerButton.disabled = !recentDays.length || index <= 0;
      displayDay(recentDays[index] || { date: null, events: [] }, recentVideos);
      gamesElement.scrollLeft = 0;
    }
    function moveDay(direction) {
      const index = recentDays.findIndex(day => dateKey(day.date) === selectedDateKey);
      const next = index + direction;
      if (next < 0 || next >= recentDays.length) return;
      selectedDateKey = dateKey(recentDays[next].date);
      displaySelectedDay();
    }
    olderButton.addEventListener("click", () => moveDay(1));
    newerButton.addEventListener("click", () => moveDay(-1));

    function showError(error) {
      gamesElement.replaceChildren();
      olderButton.disabled = true;
      newerButton.disabled = true;
      statusElement.textContent = "NBA · Scores unavailable";
      messageElement.textContent = "Could not load scores. ";
      const retry = document.createElement("a");
      retry.href = "#"; retry.textContent = "Try again";
      retry.addEventListener("click", e => { e.preventDefault(); load(); });
      messageElement.append(retry);
      messageElement.style.display = "block";
      console.error("NBA widget error:", error);
    }
    async function load() {
      try {
        const [days, videos] = await Promise.all([
          findRecentFinishedDays(), fetchMotionStationVideos()
        ]);
        recentDays = days;
        recentVideos = videos;
        // On first load start at the latest completed day. During the
        // 15-minute refresh, preserve the date someone is browsing.
        if (!recentDays.some(day => dateKey(day.date) === selectedDateKey)) {
          selectedDateKey = recentDays[0] ? dateKey(recentDays[0].date) : null;
        }
        displaySelectedDay();
      } catch (error) { showError(error); }
    }
    window.addEventListener("resize", fitCards);
    load();
    setInterval(load, 15 * 60 * 1000);
  </script>
</body>
</html>
